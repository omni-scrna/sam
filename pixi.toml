[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "sam"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
check = "python check.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/sam.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/sam.yml"

[dependencies]
python = "3.12.*"
anndata = "*"
h5py = "*"
numpy = "*"
pandas = "*"
scipy = "*"
scikit-learn = "*"
numba = "*"
umap-learn = "*"
hnswlib = "*"
dill = "*"
packaging = "*"

# sc-sam is PyPI-only; its deps above come from conda-forge
[pypi-dependencies]
sc-sam = "==2.0.2"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
